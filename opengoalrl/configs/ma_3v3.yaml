multi_agent:
  scenario: "three_vs_one"
  n_agents: 3
  max_steps: 400
  team_reward: true
  render: false

rewards:
  - type: "goal"
    weight: 10.0
  - type: "shot"
    weight: 2.0
  - type: "distance_to_goal"
    weight: 0.5

training:
  algorithm: "ppo"
  total_timesteps: 150000
  learning_rate: 0.0003
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  clip_range: 0.2
  seed: 42

evaluation:
  n_episodes: 20
  metrics: tactical

logging:
  log_dir: "logs/"
  save_dir: "models/ma_3v3/"
