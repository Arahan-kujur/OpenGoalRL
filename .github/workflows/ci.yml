name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: GRF-free tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (test extras, no gfootball)
        run: pip install -e ".[test]"

      - name: Run GRF-free test suite
        run: pytest opengoalrl/tests/ -v -k "not test_env"

  lint:
    name: Compile check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile package
        run: python -m compileall opengoalrl benchmarks
